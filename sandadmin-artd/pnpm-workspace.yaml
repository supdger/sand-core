allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  core-js: true
  es5-ext: true
  esbuild: true
  vue-demi: true

# Production audit floors. These are patched releases inside the ranges
# already declared by the parents; they are not advisory ignores.
overrides:
  lodash: '>=4.18.1 <5'
  lodash-es: '>=4.18.1 <5'
  defu: '>=6.1.5 <7'
  postcss: '>=8.5.23 <9'
  'nanoid@>=3 <3.3.18': 3.3.18
  source-map-js: '>=1.2.2 <2'
  'markdown-it@>=14 <15': '>=14.3.3 <15'
  'preact@>=10.27.0 <10.27.3': 10.27.3
  # vue-img-cutter declares vue-i18n but does not import it. Drop the unused
  # 9.14.5 edge (GHSA-83rm-6c8r-g728) instead of shipping that advisory.
  'vue-img-cutter>vue-i18n': '-'
